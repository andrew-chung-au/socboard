# The Compose stack (#221): start it, check the roles and the ports, start it again, stop it.
# No repository secret is read: make compose-up makes throwaway secrets in the runner's checkout.
name: socboard compose

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every docker compose command below reads the secrets file make compose-up writes.
      COMPOSE_ENV_FILES: compose.secrets
      # Baked into the image's labels (compose.yaml build arguments; #235). Empty on a pull request.
      GIT_COMMIT: ${{ github.sha }}
      BUILD_DATE: ${{ github.event.head_commit.timestamp }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"

      - run: uv sync --locked

      - name: Start the stack
        run: make compose-up

      - name: Health through the proxy and on the app's own port
        run: |
          make smoke URL=http://127.0.0.1:8080 HEALTH_ONLY=1
          make smoke URL=http://127.0.0.1:8000 HEALTH_ONLY=1

      - name: The application role is not a superuser or the owner, cannot disable the triggers, and the four triggers are on
        run: |
          docker compose exec -T app python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["SOCBOARD_DATABASE_URL"], hide_parameters=True)
          with engine.connect() as conn:
              role = conn.execute(text("SELECT rolsuper, rolcreatedb, rolcreaterole, current_user::text FROM pg_roles WHERE rolname = current_user")).one()
              owner = conn.execute(text("SELECT pg_get_userbyid(relowner)::text FROM pg_class WHERE relname = 'audit_entries'")).scalar_one()
              triggers = [row[0] for row in conn.execute(text("SELECT tgname || ' ' || tgenabled::text FROM pg_trigger WHERE tgrelid = 'audit_entries'::regclass AND NOT tgisinternal ORDER BY tgname"))]
          assert role[:3] == (False, False, False), "the application role has a privilege it must not have"
          assert role[3] == "socboard_app" and owner == "socboard_owner", "wrong roles"
          assert triggers == ["audit_entries_no_delete A", "audit_entries_no_reuse_id A", "audit_entries_no_truncate A", "audit_entries_no_update A"], triggers
          try:
              with engine.begin() as conn:
                  conn.execute(text("ALTER TABLE audit_entries DISABLE TRIGGER ALL"))
          except Exception:
              print("DISABLE TRIGGER refused")
          else:
              sys.exit("DISABLE TRIGGER was not refused")
          PY

      - name: The superuser's password is not in the app's environment
        run: |
          if docker compose exec -T app env | grep -q '^STACK_PG_SUPERUSER_PASSWORD='; then
            echo "the app holds the superuser's password"
            exit 1
          fi

      - name: Mask every generated value in the log
        run: |
          while IFS='=' read -r name value; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done < compose.secrets

      - name: Fetch the built image's own schema out of the app container
        run: |
          docker compose exec -T app python -c "import json; from socboard.app import create_app; print(json.dumps(create_app().openapi()))" > "$RUNNER_TEMP/schema.json"
          test -s "$RUNNER_TEMP/schema.json"

      - name: Integration tests against the stack (journeys, forwarded-address rule, schema)
        run: |
          set -a
          . ./compose.secrets
          set +a
          SOCBOARD_BASE_URL=http://127.0.0.1:8080 STACK_APP_URL=http://127.0.0.1:8000 STACK_SCHEMA_FILE="$RUNNER_TEMP/schema.json" make test-stack

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install the browser test's packages and Chromium
        run: |
          make e2e-install
          cd e2e && bunx playwright install --with-deps chromium

      - name: Browser test against the stack (two analysts and a lead)
        run: |
          set -a
          . ./compose.secrets
          set +a
          SOCBOARD_BASE_URL=http://127.0.0.1:8080 make e2e

      - name: Remove every secret from the failure artifacts
        id: redact
        if: failure()
        run: python3 e2e/redact_traces.py e2e/test-results compose.secrets

      - name: Keep the screenshot and trace of a failed browser test for 7 days
        if: ${{ failure() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      # Only a push to main saves the image, right after the tests that ran against it (before the second start,
      # which builds again): the publish workflow (publish.yml) pushes exactly this one.
      - name: Check the tested image's files, as the image job does
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          id="$(docker create socboard-stack:local)"
          mkdir -p "$RUNNER_TEMP/image-files"
          docker export "$id" | tar -x -C "$RUNNER_TEMP/image-files" app
          docker rm "$id" > /dev/null
          python3 scripts/check_image_files.py "$RUNNER_TEMP/image-files"

      - name: Save the tested image for the publish workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker save socboard-stack:local | gzip -1 > "$RUNNER_TEMP/tested-image.tar.gz"
          docker image inspect --format '{{.Id}}' socboard-stack:local > "$RUNNER_TEMP/tested-image.id"
          cat "$RUNNER_TEMP/tested-image.id"

      - name: Keep the tested image for one day
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: |
            ${{ runner.temp }}/tested-image.tar.gz
            ${{ runner.temp }}/tested-image.id
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Start again; it succeeds and the seeded users are unchanged
        run: |
          count() { docker compose exec -T app python -c "import os; from sqlalchemy import create_engine, text; print(create_engine(os.environ['SOCBOARD_DATABASE_URL']).connect().execute(text('SELECT count(*) FROM users')).scalar_one())"; }
          before="$(count)"
          make compose-up
          after="$(count)"
          echo "users before $before, after $after"
          test "$before" = "3" && test "$after" = "3"

      - name: Stop it; the data volume stays
        run: |
          make compose-down
          docker volume ls --quiet | grep --line-regexp socboard_socboard-pgdata

      - name: The stack's log, if anything failed
        if: failure()
        run: docker compose logs --no-color
