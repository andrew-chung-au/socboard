# Terraform check: format and validate every Terraform folder. No cloud credential, no secret.
name: terraform check

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-check.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the Terraform version
        id: tf
        run: |
          v=$(tr -d '[:space:]' < terraform/.terraform-version 2>/dev/null || true)
          if [ -z "$v" ]; then
            echo "::error::terraform/.terraform-version is missing or empty"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Init and validate each folder
        run: |
          find terraform -name '*.tf' -printf '%h\n' | sort -u > folders.txt
          if [ ! -s folders.txt ]; then
            echo "::error::no *.tf file found under terraform/"
            exit 1
          fi
          while read -r dir; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done < folders.txt
