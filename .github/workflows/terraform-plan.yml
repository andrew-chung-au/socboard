# Terraform plan (#209, D18b): a read-only plan of terraform/server/ on a pull request from this repository,
# with the plan role (terraform/ci-access/plan.tf). Decision record: _docs/decisions/2026-11-15T1722Z-terraform-plan-ci.md.
#
# - Only counts reach the public log and job summary: the plan goes to a file under $RUNNER_TEMP, every
#   terraform command's output is discarded (show -json goes only into scripts/check_plan_actions.py), a failure
#   prints one fixed message, and the plan file is deleted at the end. Diagnose a failure locally.
# - scripts/check_plan_actions.py fails the job on any destroy or replace; those go through the human's apply.
# - The role ARN comes from a secret (masked); never pass it through a variable, a step output or the summary.
#   The ARN is never printed, so the account number stays out of the log (mask-aws-account-id stays on as well).
# - The credentials action prints "Authenticated as assumedRoleId AROA..." and mask-aws-account-id does not hide it.
#   The step before it masks the plan role's unique ID, read from secrets.AWS_PLAN_ROLE_ID (the only place that
#   secret is used), and fails with a fixed message, no value, if the secret is empty.
# - The log-check job runs after the plan job, even if it failed (same-repository pull requests only). It holds only
#   actions: read and no secret: it downloads the plan job's log with gh (the listing and the download are retried
#   up to 5 times, RETRY_SLEEP seconds apart, as the log may not be ready while the run is in progress) and fails if
#   the log still holds an AROA... unique ID (masking is best-effort). It prints only fixed lines, never the log or
#   the match, and each failure names its stage (jobs not listed, plan job not found, log not downloaded, log empty,
#   grep failed).
# - The plan role cannot read a secret value, but the reviewer must refuse a change to terraform/server/outputs.tf
#   that outputs a secret value, or an output not marked sensitive that could hold one (Deploy record, section F).
# - Instance user data must never hold a secret: the plan role reads it (ec2:Describe*) in every same-repository run.
# - tests/test_terraform_plan_workflow.py checks this file; pull_request_target is forbidden in every workflow.
name: terraform plan

permissions: {}

on:
  pull_request:
    paths:
      - "terraform/server/**"
      - "terraform/.terraform-version"
      - ".github/workflows/terraform-plan.yml"

defaults:
  run:
    shell: bash

jobs:
  plan:
    # Forks get no OIDC token under pull_request; this skips their job before any step runs as well.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the Terraform version
        id: tf
        run: |
          v=$(tr -d '[:space:]' < terraform/.terraform-version 2>/dev/null || true)
          if [ -z "$v" ]; then
            echo "::error::terraform/.terraform-version is missing or empty"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: The committed backend file is present
        run: |
          if [ ! -f terraform/server/backend.tf ]; then
            echo "::error::terraform/server/backend.tf is missing; the human commits it in D19a (#207)"
            exit 1
          fi

      - name: Mask the plan role's unique ID
        env:
          ROLE_ID: ${{ secrets.AWS_PLAN_ROLE_ID }}
        run: |
          if [ -z "$ROLE_ID" ]; then
            echo "::error::the plan role unique ID secret is missing or empty"
            exit 1
          fi
          echo "::add-mask::$ROLE_ID"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      # -lock=false: the plan role cannot write the native lock file (terraform/ci-access/plan.tf, #156).
      - name: Plan and check its actions (counts only)
        run: |
          fail() { echo "terraform plan failed; reproduce it locally with the server plan step in terraform/README.md"; exit 1; }
          terraform -chdir=terraform/server init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" > /dev/null 2>&1 || fail
          terraform -chdir=terraform/server plan -input=false -lock=false -no-color -out="$RUNNER_TEMP/server.tfplan" > /dev/null 2>&1 || fail
          set +e
          terraform -chdir=terraform/server show -json "$RUNNER_TEMP/server.tfplan" 2> /dev/null | python3 -I scripts/check_plan_actions.py
          codes=("${PIPESTATUS[@]}")
          set -e
          if [ "${codes[0]}" -ne 0 ]; then fail; fi
          exit "${codes[1]}"

      - name: Delete the plan file
        if: always()
        run: rm -f "$RUNNER_TEMP/server.tfplan"

  # Fails closed: no plan job, no log, an empty log or a match all fail the job. Never prints the log or a match.
  # Each failure prints its own fixed line, so the stage that failed is known. The jobs listing and the log download
  # are tried up to 5 times, RETRY_SLEEP seconds apart: the plan job's log may not be downloadable while the run is
  # still in progress (this job runs inside the same run). Worst case is about 2 minutes, under the timeout.
  log-check:
    needs: plan
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: The plan job's log holds no role unique ID
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RETRY_SLEEP: "15"
        run: |
          fail() { exit 1; }
          log="$RUNNER_TEMP/plan-job.log"
          trap 'rm -f "$log"' EXIT
          listed=0
          job_id=""
          for try in 1 2 3 4 5; do
            job_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq '.jobs[] | select(.name == "plan") | .id' 2> /dev/null) && listed=1
            if [ "$listed" -eq 1 ]; then break; fi
            if [ "$try" -lt 5 ]; then sleep "$RETRY_SLEEP"; fi
          done
          if [ "$listed" -ne 1 ]; then echo "log check failed: could not list the run's jobs"; fail; fi
          case "$job_id" in ''|*[!0-9]*) echo "log check failed: plan job not found"; fail ;; esac
          outcome=download
          for try in 1 2 3 4 5; do
            if gh api "repos/$REPO/actions/jobs/$job_id/logs" > "$log" 2> /dev/null; then
              outcome=empty
              if [ -s "$log" ]; then outcome=ready; break; fi
            else
              outcome=download
            fi
            if [ "$try" -lt 5 ]; then sleep "$RETRY_SLEEP"; fi
          done
          if [ "$outcome" = download ]; then echo "log check failed: could not download the plan job's log"; fail; fi
          if [ "$outcome" = empty ]; then echo "log check failed: the plan job's log is empty"; fail; fi
          set +e
          grep -Eq 'AROA[A-Z0-9]+' "$log"
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then echo "log check FAILED: the plan job's log holds a role unique ID"; fail; fi
          if [ "$found" -ne 1 ]; then echo "log check failed: grep failed"; fail; fi
          rm -f "$log"
          echo "log check passed: the plan job's log holds no role unique ID"
