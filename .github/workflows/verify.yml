# CI backstop: runs the verification gate on every push. Standalone repo.
name: socboard verify

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: make install

      - name: Verify
        run: make verify BASE="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
