# Tempo as one process with local storage (#292; from #340's skeleton, settled by run 44003479301:
# grafana/tempo 3.1.1 with -target=all and no Kafka). Traces come in over OTLP/HTTP on 4318 (from the
# collector) and are read by id on 3200.
# Retention: blocks are kept 24 hours (a per-tenant default override, which the compaction workers read).
# VERIFY: the first run of the overlay shows Tempo starting with this key and the block count staying small.
# The disk limit is the named volume's size (compose.observability.yaml): a full volume stops writes, it
# does not grow the host's disk.
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 24h

usage_report:
  reporting_enabled: false
