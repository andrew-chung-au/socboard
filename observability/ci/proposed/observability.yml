# The observability checks (#340): one job, one script. A later check changes observability/ci/check.sh,
# not this file, so this protected file changes once. No secret, no Environment, no cloud role, and the
# token can only read the repository.
#
# PROPOSED: this copy lives in observability/ci/proposed/ until the CI lane or the maintainer lands it as
# .github/workflows/observability.yml (workflows are protected files; an agent does not write them).
# Copy it, do not move it: tests/test_observability_workflow.py reads this proposed copy.
# Landing it also needs `socboard observability` added to the trigger list of publish.yml and to
# TRIGGER_LIST in tests/test_publish_workflow.py: a path-filtered workflow that can run on a push to main
# must be listed there (tests/workflow_triggers.py, list_problems). It is not added to the gate's
# REQUIRED list, which holds only the workflows that run on every push; like `terraform check`, it
# holds the publish back when it runs on a commit and fails.
name: socboard observability

permissions:
  contents: read

on:
  push:
    paths: &paths
      - "observability/**"
      - "compose.observability.yaml"
      - "socboard/telemetry.py"
      - "socboard/ingest.py"
      - "socboard/cases.py"
      - "scripts/observability_*"
      - ".github/workflows/observability.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
  schedule:
    # Nightly, 17:30 UTC (03:30 on the project's clock): the images are pinned, but a pinned image's
    # registry, the runner's Docker and the paths the filter does not name can still change.
    - cron: "30 17 * * *"

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"

      # The screenshots for the reviewer evidence (#293): the browser is the one e2e/ already pins.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install the browser for the screenshots
        run: |
          make e2e-install
          cd e2e && bunx playwright install --with-deps chromium

      - name: Run the observability checks
        run: bash observability/ci/check.sh
        env:
          # Set, so check.sh also runs the probe and photographs Grafana; the directory is uploaded below.
          SCREENSHOT_DIR: ${{ runner.temp }}/observability-evidence

      # CI never commits: a person commits these once, from the artifact, under _docs/evidence/observability/.
      - name: Keep the screenshots and the query answers for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-evidence
          path: ${{ runner.temp }}/observability-evidence
          retention-days: 30
          if-no-files-found: ignore
