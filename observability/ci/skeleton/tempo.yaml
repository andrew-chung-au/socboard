# Tempo as one process with local storage (#340), from Tempo's own single-binary example. Traces come
# in over OTLP/HTTP on 4318 (from the collector) and are read by id on 3200.
# VERIFY: this config runs on grafana/tempo 3.1.1 with -target=all and no Kafka.
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
