# The walking skeleton's stack (#340): a collector and three stores, nothing else. Started by
# observability/ci/check.sh, queried from the runner on the loopback. #292 builds the real overlay
# (compose.observability.yaml) from these configs.
#
# Ports are published on 127.0.0.1 only, so the runner can reach them and nothing else can.
# Images are pinned by tag and index digest. VERIFY: each digest was read from the registry on
# 2026-11-16 (the tag's multi-architecture index); re-read it when the tag is changed.
name: socboard-obs-skeleton

services:
  otel-collector:
    # otel/opentelemetry-collector-contrib 0.142.0 (the contrib build has the Prometheus remote-write exporter)
    image: otel/opentelemetry-collector-contrib:0.142.0@sha256:38c349c3b7a2fd7ea46700cde8fa13d35b699ef2ce245bdf34dae2a413512f76
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"   # OTLP over HTTP, where the emitter sends
      - "127.0.0.1:13133:13133" # the health_check extension, polled by query.py ready
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    # grafana/tempo 3.1.1, run as one process (-target=all), as its own single-binary example does
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # the query API

  loki:
    # grafana/loki 3.7.10, single process, local filesystem
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100" # the query API and the native OTLP endpoint (/otlp)

  prometheus:
    # prom/prometheus v3.16.0, with the remote-write receiver and exemplar storage on
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
