# The collector of the walking skeleton (#340): OTLP over HTTP in; traces to Tempo, logs to Loki's
# native OTLP endpoint, metrics to Prometheus by remote write. No processor: #292 adds the allow-list.
# Every exporter and path below held in `socboard observability` run 44003479301 (2026-11-17), which
# settled each VERIFY; the record is _docs/records/2026-11-17T0233Z-measure-observability-skeleton-first-run.md.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  # Tempo's own OTLP/HTTP receiver (tempo.yaml). Settled: the trace arrived (run 44003479301).
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  # Loki's native OTLP endpoint is /otlp (the exporter adds /v1/logs). Settled on Loki 3.7.10 (run 44003479301).
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  # Remote write sends the histogram's exemplars when the data point has them. Settled: the exemplar arrived with the trace id (run 44003479301).
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      exporters: [prometheusremotewrite]
