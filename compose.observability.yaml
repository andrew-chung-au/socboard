# The observability overlay (#292, with Grafana from #293), layered on compose.yaml:
#
#     docker compose --env-file compose.secrets --env-file observability.secrets \
#         -f compose.yaml -f compose.observability.yaml up
#
# (`make observability-up` makes both secret files and runs that.) It adds the five services that receive,
# store and route the app's signals (traces, logs and metrics) and Grafana to look at them, points the
# app's exporter at the collector, and publishes each service's port on 127.0.0.1 only, so the runner or
# the developer can query them and nothing outside the host can. compose.yaml and compose/ do not change:
# with this file left out of the command, the stack is what it was. The alert rule is
# observability/alerts/ (#296); Alertmanager's route to the on-call agent is #297.
#
# Variables: the ports on 127.0.0.1 are optional, and the defaults are the services' own:
#   STACK_OTLP_PORT (4318), STACK_OTEL_HEALTH_PORT (13133), STACK_TEMPO_PORT (3200),
#   STACK_LOKI_PORT (3100), STACK_PROMETHEUS_PORT (9090), STACK_ALERTMANAGER_PORT (9093),
#   STACK_GRAFANA_PORT (3000).
# STACK_GRAFANA_ADMIN_PASSWORD is required (Compose stops, naming it, when it is missing): the secrets
# script makes it on the first run, into `observability.secrets` (scripts/observability_secrets.py), next
# to compose.secrets; it is never printed. Anonymous access to Grafana is off.
# A second stack on the same host needs its own values, as it does for STACK_APP_PORT (#271).
#
# Limits: each store keeps 24 hours of data at most, in a named volume whose size is capped. The volumes
# below are in-memory file systems of fixed size, so a full store cannot fill the host's disk; the data
# does not survive a host restart, which is right for a stack that runs in CI and on a developer's
# machine. Those pages are charged to the container that writes them, so each cap is below its service's
# mem_limit (192 MiB against 256, 256 against 384, 64 against 160), and a store that outgrew its cap would
# fail its writes before it was killed; no run is long enough to show which comes first (checked by
# tests/test_observability_compose.py). Each service has a memory limit; the six add up to 1504 MiB, within
# 1.5 GiB (1536 MiB).
#
# Images are pinned by tag and index digest, as compose.yaml does. Each digest was read from the registry
# on 2026-11-16 (Alertmanager's on 2026-11-17) and pulled and run by `socboard observability` run
# 44007243871 (2026-11-17), which settled the VERIFY notes of this file and of observability/*/.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0@sha256:38c349c3b7a2fd7ea46700cde8fa13d35b699ef2ce245bdf34dae2a413512f76
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "10001:10001"
    mem_limit: 256m
    volumes:
      - ./observability/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:${STACK_OTLP_PORT:-4318}:4318 # OTLP over HTTP, where the probe and the emitter send
      - 127.0.0.1:${STACK_OTEL_HEALTH_PORT:-13133}:13133 # the health_check extension, polled by observability/ci/query.py
    depends_on:
      - tempo
      - loki
      - prometheus
    networks: [stack]

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    user: "10001:10001"
    mem_limit: 384m
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - 127.0.0.1:${STACK_TEMPO_PORT:-3200}:3200
    networks: [stack]

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "10001:10001"
    mem_limit: 384m
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - 127.0.0.1:${STACK_LOKI_PORT:-3100}:3100
    networks: [stack]

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    user: "65534:65534"
    mem_limit: 256m
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${STACK_PROMETHEUS_PORT:-9090}:9090
    depends_on:
      - alertmanager
    networks: [stack]

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    user: "65534:65534"
    mem_limit: 64m
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
    ports:
      - 127.0.0.1:${STACK_ALERTMANAGER_PORT:-9093}:9093
    networks: [stack]

  # Grafana (#293): the dashboard and the three datasources are provisioned from files, so a start from
  # nothing needs no clicks. Its login is the admin user with the generated password; anonymous access and
  # sign-up are off. Reporting and update checks are off (it makes no call out). Port 3000 on 127.0.0.1 only.
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    user: "472:472"
    mem_limit: 160m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${STACK_GRAFANA_ADMIN_PASSWORD:?STACK_GRAFANA_ADMIN_PASSWORD is required (make observability-up makes it)}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/socboard-alert-to-queue.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${STACK_GRAFANA_PORT:-3000}:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      - tempo
      - loki
      - prometheus
    networks: [stack]

  # The app's exporter: the collector's address on the stack network. The SDK's metric export interval
  # is 60 seconds; 5 keeps the drill (#299) near three minutes from the defect to the firing alert.
  # The two operator-set resource attributes are the ones the contract names (section 1).
  app:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=${GIT_COMMIT:-unknown}
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  # In-memory file systems of fixed size, owned by the user each image runs as, so the first start has
  # no permission error and a store cannot outgrow its limit. Settled: all three stores started and
  # wrote to them (run 44007243871).
  tempo-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=10001,gid=10001
  loki-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=10001,gid=10001
  prometheus-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=192m,uid=65534,gid=65534
  grafana-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,uid=472,gid=472
