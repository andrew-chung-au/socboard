[project]
name = "socboard"
version = "0.1.0"
description = "Web-based alert triage case manager for a security operations centre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
