[project]
name = "socboard"
version = "0.1.0"
description = "Web-based alert triage case manager for a security operations centre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
